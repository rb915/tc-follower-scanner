services:
  - type: web
    name: tc-follower-scanner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ROCKETAPI_KEY
        sync: false
      - key: MIN_FOLLOWERS
        value: "100000"
